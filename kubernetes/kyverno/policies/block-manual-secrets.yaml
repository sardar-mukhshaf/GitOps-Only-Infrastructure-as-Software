apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: block-manual-secrets
  annotations:
    policies.kyverno.io/title: "Block Manual Secret Creation"
    policies.kyverno.io/category: "Security"
    policies.kyverno.io/severity: "high"
    policies.kyverno.io/description: "Prevent kubectl create secret - use External Secrets Operator or SOPS only"
    policies.kyverno.io/minversion: "1.12.0"
spec:
  validationFailureAction: Enforce
  background: false
  rules:
    - name: block-kubectl-create-secret
      match:
        resources:
          kinds:
            - Secret
      exclude:
        resources:
          namespaces:
            - kube-system
            - external-secrets
      validate:
        message: "Manual secret creation is blocked. Use External Secrets Operator or SOPS-decrypted secrets managed by ArgoCD."
        deny:
          conditions:
            - key: "{{request.operation}}"
              operator: Equals
              value: CREATE
            - key: "{{request.userInfo.username}}"
              operator: Equals
              value: "kubernetes-admin"
