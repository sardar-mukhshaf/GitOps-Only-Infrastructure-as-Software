apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cmp-cm
  namespace: argocd
  annotations:
    description: "Config Management Plugin definitions for SOPS + Helm/Kustomize"
    managed-by: "gitops"
data:
  plugin.yaml: |
    apiVersion: argoproj.io/v1alpha1
    kind: ConfigManagementPlugin
    metadata:
      name: sops-helm
    spec:
      version: v1.0
      init:
        command: [sh, -c]
        args: ["which sops || (wget -O /usr/local/bin/sops https://github.com/getsops/sops/releases/download/v3.8.1/sops-v3.8.1.linux.amd64 && chmod +x /usr/local/bin/sops)"]
      generate:
        command: [sh, -c]
        args: ["find . -name '*.enc.yaml' -exec sops -d -i {} \\; 2>/dev/null || true; helm template . --include-crds"]
      discover:
        find:
          command: [sh, -c]
          args: ["test -f Chart.yaml && echo 'sops-helm'"]
    ---
    apiVersion: argoproj.io/v1alpha1
    kind: ConfigManagementPlugin
    metadata:
      name: sops-kustomize
    spec:
      version: v1.0
      init:
        command: [sh, -c]
        args: ["which sops || (wget -O /usr/local/bin/sops https://github.com/getsops/sops/releases/download/v3.8.1/sops-v3.8.1.linux.amd64 && chmod +x /usr/local/bin/sops)"]
      generate:
        command: [sh, -c]
        args: ["find . -name '*.enc.yaml' -exec sops -d -i {} \\; 2>/dev/null || true; kustomize build ."]
      discover:
        find:
          command: [sh, -c]
          args: ["test -f kustomization.yaml && echo 'sops-kustomize'"]
