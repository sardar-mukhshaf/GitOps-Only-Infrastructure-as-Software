apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-rbac-cm
  namespace: argocd
  annotations:
    description: "ArgoCD RBAC configuration - devs can sync apps, admins can manage projects"
    managed-by: "gitops"
data:
  policy.default: role:readonly
  policy.csv: |
    p, role:dev-team, applications, get, */*, allow
    p, role:dev-team, applications, sync, */*, allow
    p, role:dev-team, projects, get, *, allow
    p, role:platform-admin, applications, *, */*, allow
    p, role:platform-admin, projects, *, *, allow
    p, role:platform-admin, repositories, *, *, allow
    p, role:platform-admin, certificates, *, *, allow
    g, platform-team, role:platform-admin
    g, dev-team, role:dev-team
