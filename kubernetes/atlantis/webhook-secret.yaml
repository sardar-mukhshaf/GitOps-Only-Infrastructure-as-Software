apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: atlantis-github-token
  namespace: atlantis
  annotations:
    description: "GitHub token for Atlantis integration"
    managed-by: "gitops"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: atlantis-github-token
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: token
      remoteRef:
        key: atlantis/github-token
        property: token
    - secretKey: username
      remoteRef:
        key: atlantis/github-token
        property: username
