apiVersion: v1
kind: ServiceAccount
metadata:
  name: atlantis
  namespace: atlantis
  annotations:
    description: "Service account for Atlantis server"
    managed-by: "gitops"
    eks.amazonaws.com/role-arn: ""
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: atlantis
  namespace: atlantis
  annotations:
    description: "Least-privilege Role for Atlantis in its namespace"
    managed-by: "gitops"
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: atlantis
  namespace: atlantis
  annotations:
    description: "Bind atlantis Role to atlantis ServiceAccount"
    managed-by: "gitops"
subjects:
  - kind: ServiceAccount
    name: atlantis
    namespace: atlantis
roleRef:
  kind: Role
  name: atlantis
  apiGroup: rbac.authorization.k8s.io
