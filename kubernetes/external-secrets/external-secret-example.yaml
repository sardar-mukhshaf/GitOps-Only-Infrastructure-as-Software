apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: api-gateway-tls
  namespace: prod
  annotations:
    description: "Sync TLS certificate from AWS Secrets Manager to Kubernetes"
    managed-by: "gitops"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: api-gateway-tls
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/tls
  data:
    - secretKey: tls.crt
      remoteRef:
        key: prod/api-gateway/tls-cert
        property: tls.crt
    - secretKey: tls.key
      remoteRef:
        key: prod/api-gateway/tls-cert
        property: tls.key
